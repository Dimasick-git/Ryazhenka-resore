name: Синхронизация ресурсов Ultra
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: sync-ultra-resources
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить и синхронизировать хоумбрю, моды и сохранения
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 sync_resources.py --publish